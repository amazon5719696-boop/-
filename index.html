<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Gallery | تحف وهدايا</title>
<meta name="description" content="متجر My Gallery: تحف وهدايا واكليرك وسيليكون ومج بطلب سهل عبر واتساب">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fb;--card:#fff;--text:#2b1840;--muted:#7a6a8c;--chip:#f1e6ff;--a:#7c3aed;--b:#ec4899;--c:#f59e0b;--shadow:0 6px 18px rgba(124,58,237,.15);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150d22;--card:#241538;--text:#f6eeff;--muted:#b9a7d1;--chip:#34204f;--shadow:0 6px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}
body{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:auto;padding-bottom:0}
header{background:linear-gradient(135deg,var(--a),var(--b) 60%,var(--c));color:#fff;padding:22px 18px 30px;border-radius:0 0 28px 28px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px}
.sub{opacity:.9;font-size:14px;margin-top:4px}
#cartBtn{background:#fff3;border:0;color:#fff;font-size:22px;border-radius:50%;width:46px;height:46px;position:relative;cursor:pointer}
#badge{position:absolute;top:-4px;left:-4px;background:var(--c);color:#2b1840;font-size:12px;font-weight:700;border-radius:50%;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center}
#q{width:100%;margin-top:16px;padding:13px 16px;border-radius:16px;border:0;font:inherit;font-size:15px;background:#fff;color:#2b1840}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 14px 6px}
.chip{flex:none;border:0;background:var(--chip);color:var(--text);padding:10px 16px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.pic{height:110px;display:flex;align-items:center;justify-content:center;font-size:56px;position:relative}
.heart{position:absolute;top:8px;left:8px;background:#fff9;border:0;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
.info{padding:10px 12px 12px}
.name{font-weight:700;font-size:15px}
.desc{color:var(--muted);font-size:12px;margin:2px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;color:var(--a);font-size:15px}
.add{border:0;background:linear-gradient(135deg,var(--b),var(--c));color:#fff;border-radius:12px;width:38px;height:38px;font-size:20px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--chip)}
.item .e{font-size:30px}
.item .n{flex:1;font-size:14px;font-weight:700}
.qty{display:flex;align-items:center;gap:8px}
.qty button{border:0;background:var(--chip);color:var(--text);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:14px 0}
.buy{width:100%;border:0;padding:15px;border-radius:16px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#16a34a,#22c55e);cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:var(--card);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(124,58,237,.15)}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--a);font-weight:700}
nav span{display:block;font-size:22px}
.pic.big{height:170px;font-size:84px;border-radius:18px;margin-bottom:10px;overflow:hidden}
.feat{list-style:none;padding:0;margin-top:8px}.feat li{background:var(--chip);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:14px}
.offer{display:flex;flex-direction:column;gap:2px;background:linear-gradient(135deg,#fdf2f8,#f3e8ff);color:#2b1840;border-radius:16px;padding:12px 14px;margin-bottom:10px;border:2px dashed var(--b)}
.offer b{color:var(--a)}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:30}#modal.open{display:flex}
.social{text-align:center;padding:14px 14px 4px;color:var(--muted);font-size:14px}
.srow{display:flex;justify-content:center;gap:12px;margin-top:10px}
.srow button{width:46px;height:46px;border-radius:50%;border:0;color:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
#bear{position:fixed;left:8px;top:48%;width:46px;height:62px;border:0;background:none;cursor:grab;z-index:15;filter:drop-shadow(0 4px 6px rgba(236,72,153,.5));animation:bob 2s ease-in-out infinite;padding:0;touch-action:none;user-select:none;transition:left .45s cubic-bezier(.34,1.56,.64,1)}
#bear.drag{transition:none;cursor:grabbing}
#soc{position:fixed;right:8px;top:34%;display:flex;flex-direction:column;gap:9px;z-index:14}
.sb{position:relative}
.sb button{width:36px;height:36px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);display:block}
.pop{position:absolute;right:44px;top:50%;transform:translateY(-50%) scale(.5);transform-origin:right center;opacity:0;pointer-events:none;transition:.2s;background:var(--card);color:var(--text);padding:7px 10px;border-radius:14px;box-shadow:var(--shadow);font-size:12px;direction:ltr;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 70px)}
.pop.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.pop span{white-space:nowrap}
.pop a{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-radius:10px;padding:5px 10px;text-decoration:none;font-size:12px;flex:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
/* ===== السماء والغيوم + الشعار ===== */
:root{--bg:#f2f9ff}
header{position:relative;overflow:hidden;background:linear-gradient(180deg,#0ea5e9,#38bdf8 55%,#bae6fd);text-shadow:0 1px 4px rgba(3,105,161,.45)}
header::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 46px 16px at 12% 28%,#fff,transparent 70%),radial-gradient(ellipse 70px 22px at 38% 62%,#ffffffd9,transparent 70%),radial-gradient(ellipse 54px 18px at 64% 22%,#fff,transparent 70%),radial-gradient(ellipse 80px 24px at 88% 70%,#ffffffcc,transparent 70%);background-size:200% 100%;animation:drift 40s linear infinite alternate;opacity:.9}
header>*{position:relative}
@keyframes drift{from{background-position:0 0}to{background-position:100% 0}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:linear-gradient(180deg,#1e3a8a,#3b82f6 90%)}}
#logo{font-family:"Lalezar","Cairo",sans-serif;font-size:36px;font-weight:400;letter-spacing:1px}
#logo span{display:inline-block;animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-4deg)}}
/* ===== منتجات أصغر: ٣ في الصف ===== */
.grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 10px}
.card{border-radius:14px}
.pic{height:76px;font-size:38px}
.heart{width:24px;height:24px;font-size:12px;top:5px;left:5px}
.info{padding:7px 8px 9px}
.name{font-size:12px;line-height:1.3}
.desc{font-size:10px;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:11px}
.add{width:28px;height:28px;font-size:17px;border-radius:9px}
/* ===== أيقونات التواصل: صف ثابت أسفل الشاشة ===== */
#soc{left:0;right:0;top:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px));flex-direction:row;justify-content:center;gap:14px;pointer-events:none}
.sb button{width:34px;height:34px;font-size:15px;pointer-events:auto}
.pop{position:fixed;right:auto;top:auto;transform:scale(.4);max-width:calc(100vw - 16px);pointer-events:none}
.pop.on{transform:scale(1);pointer-events:auto}
/* ===== الدبدوب داخل دائرة بيضاء بمظهر 3D ===== */
#bear{width:60px;height:60px;border-radius:50%;background:#fff;padding:6px;border:2px solid #fbcfe8;perspective:160px;filter:drop-shadow(0 4px 8px rgba(236,72,153,.45))}
#bear svg{animation:sway 3s ease-in-out infinite;transform-style:preserve-3d}
@keyframes sway{0%,100%{transform:rotateY(-22deg) rotateZ(-3deg)}50%{transform:rotateY(22deg) rotateZ(3deg)}}
/* ===== فوتر التواصل ===== */
#ft{background:#000;color:#fff;text-align:center;padding:26px 16px 96px;margin-top:18px;border-radius:26px 26px 0 0}
#ft h3{font-size:20px;margin-bottom:12px}
#ft h4{font-size:15px;font-weight:600;margin:22px 0 14px}
#ft .ph{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:20px;letter-spacing:1px}
#ft .ph svg{width:22px;height:22px;fill:#fff}
.fi{display:flex;justify-content:center;gap:26px}
.fi a{color:#fff;display:flex;cursor:pointer}
.fi svg{width:28px;height:28px}
#ft .cp{margin-top:22px;padding-top:16px;border-top:1px solid #333;color:#bbb;font-size:13px}
.fi{flex-direction:column;align-items:flex-end;gap:18px;padding:0 24px}
.pop{background:transparent;box-shadow:none;color:#fff;padding:2px 4px;font-size:14px;white-space:nowrap}
.pop a{background:none;color:#fff;padding:0;border-radius:0;font-size:14px;text-decoration:underline}
/* ===== شريط القائمة الأبيض + التسجيل ===== */
#bar{position:sticky;top:0;z-index:12;background:#fff;color:#2b1840;display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#hb{border:0;background:none;display:flex;flex-direction:column;gap:5px;padding:6px;cursor:pointer}
#hb i{display:block;width:26px;height:3px;border-radius:2px;background:#2b1840}
#hello{font-weight:700;font-size:14px}
#menu{display:none;position:absolute;top:100%;right:12px;background:#fff;border-radius:0 0 16px 16px;box-shadow:0 8px 20px rgba(0,0,0,.2);padding:8px;min-width:180px;flex-direction:column;gap:6px}
#menu.open{display:flex}
#menu button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#2b1840;background:#f1e6ff;text-align:right}
#menu button:first-child{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff}
.sec{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:32px;color:#0891b2;text-align:center;margin:20px 14px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec{color:#22d3ee}}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--chip);background:var(--bg);color:var(--text);font:inherit;font-size:15px;margin-bottom:10px}
.two{display:flex;gap:8px}.two .inp{min-width:0}
.amsg{min-height:20px;font-size:13px;margin-bottom:8px;color:#dc2626}
.amsg.ok{color:#16a34a}
#brand{display:flex;align-items:center;gap:7px}
#brand svg{width:30px;height:30px}
#brand b{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:23px;background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
#hello:empty{display:none}
#hello{font-size:12px;color:#7a6a8c;font-weight:600}
.bi{margin-inline-start:auto;display:flex;gap:8px}
.bi button{width:38px;height:38px;border-radius:50%;border:0;background:#efe9fb;color:#2b1840;cursor:pointer;display:flex;align-items:center;justify-content:center;font:700 13px "Cairo",sans-serif}
.bi button svg{width:20px;height:20px}
:root[data-theme="dark"]{--bg:#000;--card:#1a1226;--text:#f6eeff;--muted:#b9a7d1;--chip:#2c1b44;--shadow:0 6px 18px rgba(0,0,0,.5)}
:root[data-theme="dark"] header{background:linear-gradient(180deg,#1e3a8a,#3b82f6 90%)}
:root[data-theme="dark"] .sec{color:#22d3ee}
:root[data-theme="light"]{--bg:#fff}
[dir="ltr"] #menu{right:auto;left:12px}
[dir="ltr"] #menu button{text-align:left}
.fi{align-items:flex-start}
[dir="ltr"] .fi{align-items:flex-end}
#brand{cursor:pointer;position:relative}
.ln{position:absolute;bottom:-11px;left:0;font-size:9px;color:#999;font-family:Cairo,sans-serif}
#brand{cursor:default}
.frow{display:flex;align-items:flex-start;gap:10px}
[dir="ltr"] .frow{flex-direction:row-reverse}
.fi{flex:none;padding:0 6px}
.flinks{flex:1;text-align:start}
.flinks h5{font-size:16px;font-weight:800;margin:0 0 4px}
.lk{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid #222;color:#fff;font:inherit;font-size:14px;padding:11px 4px;cursor:pointer;text-align:start}
.lk i{font-style:normal;font-size:18px;color:#aaa}
#pg{position:fixed;inset:0;background:var(--bg);color:var(--text);z-index:40;display:none;flex-direction:column;max-width:480px;margin:auto;padding-top:env(safe-area-inset-top,0px)}
#pg.open{display:flex}
.pgh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;color:#2b1840;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:17px}
.pgh button{border:0;background:#efe9fb;color:#2b1840;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pgh button svg{width:20px;height:20px}
[dir="ltr"] .pgh button svg{transform:scaleX(-1)}
#pgB{flex:1;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.8}
.pgp{color:var(--muted);text-align:center;margin:26px 0 16px}
.oc{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px}
.orow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.sech{font-weight:800;margin:16px 0 8px;font-size:16px;color:var(--a)}
:root{--fbg:#fff;--ftx:#111;--fln:#e5e5e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fbg:#000;--ftx:#fff;--fln:#222}}
:root[data-theme="dark"]{--fbg:#000;--ftx:#fff;--fln:#222}
#ft{background:var(--fbg);color:var(--ftx)}
.lk{color:var(--ftx);border-bottom-color:var(--fln)}
.lk i{color:var(--muted)}
.fi a{color:var(--ftx)}
#f-yt svg path{fill:var(--fbg)}
#ft .cp{border-top-color:var(--fln);color:var(--muted)}
.pop,.pop a{color:var(--ftx)}
#bear{z-index:20}
.fi svg{width:34px;height:34px}
.fi{gap:16px}

/* ===== إضافات: التنبيه + الخصم + قسم الآراء ===== */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2b1840;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.card{cursor:pointer}
.drow{display:none;justify-content:space-between;font-size:14px;color:#16a34a;font-weight:700;margin:8px 0 0}
.drow.on{display:flex}
#gift{display:none;background:var(--chip);border-radius:12px;padding:9px 12px;font-size:13px;margin-top:8px}
#gift.on{display:block}
#fb{margin:18px 14px 0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px 16px;text-align:center}
#fb h3{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:24px;color:#0891b2}
#fb p{color:var(--muted);font-size:13px;margin:4px 0 10px}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr;margin-bottom:10px}
.stars button{border:0;background:none;font-size:32px;cursor:pointer;color:#cbd5e1;line-height:1;padding:0 2px}
.stars button.on{color:#f59e0b}
#fb textarea{min-height:84px;resize:vertical}
#fb .two{margin-top:2px}
#fb .buy{margin-bottom:8px}
#fb .alt{background:linear-gradient(135deg,var(--a),var(--b))}
.rvh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-weight:800;font-size:16px;color:var(--a)}
.rvh small{color:var(--muted);font-weight:600;font-size:12px}
.rvc{background:var(--chip);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rvc .top2{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.rvc .st{color:#f59e0b;letter-spacing:1px;direction:ltr}
.rvc p{font-size:13px;line-height:1.7}
.rvn{font-size:11px;color:var(--muted);margin:4px 0 8px}
.rs button{font-size:26px}
.rvf{margin-top:12px;border-top:1px solid var(--chip);padding-top:12px}
.rvf textarea{min-height:70px}

</head>
<body>
<div id="bar"><button id="hb" data-au="menu" aria-label="القائمة"><i></i><i></i><i></i></button><div id="brand" data-au="logo"><svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".55" stop-color="#ec4899"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><rect x="2" y="4" width="28" height="24" rx="6" fill="url(#lg)"/><circle cx="11" cy="12" r="3" fill="#fff"/><path d="M4 25l9-9 5 5 4-4 8 8z" fill="#fff" fill-opacity=".92"/></svg><b>My Gallery</b></div><span id="hello"></span>
<div class="bi"><button data-au="search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></button><button id="themeBtn" data-au="theme" aria-label="Theme"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><button id="langBtn" data-au="lang" aria-label="Language">EN</button></div><div id="menu"></div></div>
<header>
  <div class="top"><div><h1 id="logo" dir="ltr">My Gallery</h1><div class="sub">أجمل التحف والهدايا لأحبابك</div></div>
  <button id="cartBtn" aria-label="السلة">🛒<span id="badge">0</span></button></div>
  <input id="q" placeholder="ابحث عن هدية أو تحفة…">
</header>
<h2 class="sec">تصفح حسب الفئة</h2>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<section id="fb"><h3>رأيك يهمنا</h3><p>شاركنا تقييمك واقتراحاتك لتحسين المتجر</p><div class="stars" id="stars"><button data-st="1" aria-label="1">★</button><button data-st="2" aria-label="2">★</button><button data-st="3" aria-label="3">★</button><button data-st="4" aria-label="4">★</button><button data-st="5" aria-label="5">★</button></div><input class="inp" id="fb-n" placeholder="اسمك (اختياري)"><textarea class="inp" id="fb-t" placeholder="اكتب رأيك أو اقتراحك هنا…"></textarea><button class="buy alt" id="fb-send">أرسل رأيك عبر واتساب 💬</button><button class="buy" id="fb-cm" style="display:none;background:linear-gradient(135deg,#0ea5e9,#38bdf8)">علّق على الصفحة مباشرة 📝</button></section>
<footer id="ft">
<h3>تواصل معنا</h3>

 function start(e){var p=pt(e),r=b.getBoundingClientRect();on=true;mv=false;sx=p.clientX;sy=p.clientY;sl=r.left;st=r.top;b.classList.add("drag")}
